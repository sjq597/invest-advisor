name: Release

# 打 tag 即发版：git tag v2.2.0 && git push origin v2.2.0
# 自动：创建 GitHub Release（附 index.html）
# Pages 改为分支直部署（Settings > Pages > Deploy from a branch），push main 即自动上线
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 准备发布物
        run: |
          mkdir -p dist
          cp index.html dist/index.html
          ls -lh dist/

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/index.html
          generate_release_notes: true

